ntent:'';position:absolute;height:26px;width:26px;top:4px;left:4px;border-radius:100%;background:white;transition:.2s}.toggle.on{background:#8E67E8}.toggle.on::after{left:27px}.toast{position:fixed;left:25px;right:25px;bottom:93px;z-index:20;max-width:530px;margin:auto;text-align:center;background:#EEE5FA;color:#26163F;padding:13px 17px;border-radius:14px;box-shadow:0 8px 36px #0009;font-size:13px;font-weight:750;line-height:1.5}.action-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}.loader{width:22px;height:22px;border:3px solid #fff4;border-top:3px solid #fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}.link{color:#F9A4D4;background:transparent;padding:4px;border:0;text-decoration:underline}.heading-2{font-size:22px;font-weight:850;margin:7px 0 11px}.preview-banner{padding:9px;background:#7D4B19;border-radius:10px;text-align:center;font-size:12px;font-weight:800;margin-bottom:13px}.story{display:flex;gap:10px;align-items:flex-start}.story .icon{font-size:25px}.foot-note{margin-top:23px;color:#8F80AC;font-size:11px;text-align:center}

:root{--bg:#110F23;--panel:#251A40;--panel2:#34244F;--line:#5B416F;--ink:#FFF8FF;--muted:#CDBFE3;--pink:#FF9EC9;--purple:#A275FF;--mint:#70ECC0}
body{background:radial-gradient(ellipse at 20% 0%,#39225A 0%,transparent 42%),#100D22}

.header{margin-bottom:19px;position:relative}.round-icon{border:1px solid #A477C144;box-shadow:inset 0 0 0 1px #E7A9FF15;color:#FFB1D9;background:linear-gradient(130deg,#493365,#312144);transform:rotate(-7deg)}
.hero{position:relative;overflow:hidden;border:1px solid #B17AC166;border-radius:27px;background:linear-gradient(145deg,#543466 0%,#322148 44%,#1D1936 100%);box-shadow:0 20px 55px #08041C85, inset 0 1px 0 #FFFFFF26}
.hero:before{content:'♥';position:absolute;top:-56px;right:-8px;font-size:190px;color:#FF8FC40C;pointer-events:none;transform:rotate(-16deg)}
.hero-top,.map,.flex,.btn-row{position:relative}.avatar{width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,#A677FF,#F78ABA);box-shadow:0 0 0 4px #ffffff18,0 7px 22px #D479DB45;font-size:30px;animation:pulseRomantic 3.3s ease-in-out infinite}
.partner-name{font-size:20px}.pill{border:1px solid #AA79CE66;box-shadow:inset 0 1px 0 #FFFFFF0D;background:#422B5A;color:#F9C3E6}

.primary:active{transform:scale(.985)}.secondary{background:linear-gradient(120deg,#513963,#443157)}
.card{border:1px solid #765A9466;background:linear-gradient(153deg,#302144,#231B3A);box-shadow:inset 0 1px 0 #FFFFFF0D,0 8px 20px #0D092840}
.mini{background:linear-gradient(145deg,#31234C,#241C3C);border:1px solid #6C518655;box-shadow:inset 0 1px 0 #FFFFFF16}.mini .icon{color:#FFBBDE}
.eyebrow{color:#FFC1E0}.welcome{padding-top:7vh;position:relative}.welcome:before{content:"♥";position:absolute;top:-28px;right:0;color:#FCA8D412;font-size:165px;transform:rotate(-17deg);pointer-events:none}
.logo{height:94px;width:94px;border-radius:33px;background:linear-gradient(135deg,#7850DB,#BD6CE4 46%,#F68EAE);box-shadow:0 14px 40px #F183C455,0 0 0 8px #A867F217;animation:pulseRomantic 3s ease-in-out infinite;font-size:49px}
.headline{font-size:35px;line-height:1.32}.glow{filter:drop-shadow(0 0 8px #E976B67A)}
.field input{border-color:#84619999;background:#332446}.field input:focus{border-color:#F6A2D3;box-shadow:0 0 0 3px #EE8DCC24}
.nav{background:#201832F5;backdrop-filter:blur(16px);border-top:1px solid #F69FD044;box-shadow:0 -8px 29px #10051D55}
.nav button.active{color:#FFADD6}.nav button.active .ico{filter:drop-shadow(0 0 7px #ED98D8)}
.splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 37%,#533477 0%,#211734 43%,#100D22 78%);color:#fff;transition:opacity .7s ease,visibility .7s ease}.splash.done{opacity:0;visibility:hidden;pointer-events:none}
.splash-art{height:180px;width:180px;position:relative;display:flex;align-items:center;justify-content:center}.splash-halo{position:absolute;inset:13px;border:1px solid #FFC4E071;border-radius:50%;box-shadow:0 0 0 17px #E896FF10,0 0 0 36px #E896FF08;animation:halo 2s ease-in-out infinite}
.splash-heart{font-size:85px;line-height:1;color:#FF9FCB;filter:drop-shadow(0 9px 24px #E658BB78);animation:heartBeat 1.8s ease-in-out infinite}
.tiny-heart{position:absolute;color:#FFD5E9;opacity:.85;animation:floatHeart 2.5s ease-in-out infinite}.th1{top:10px;left:21px;font-size:18px}.th2{right:13px;top:39px;font-size:13px;animation-delay:.6s}.th3{bottom:17px;right:30px;font-size:15px;animation-delay:1s}
.splash-title{font-size:43px;font-weight:900;letter-spacing:-1.6px;margin-top:6px}.splash-title span{color:#FF9FCB;font-size:27px;margin-left:5px}.splash-subtitle{color:#EDD5F0;font-size:15px;margin-top:7px}
.splash-loading{width:129px;height:4px;border-radius:20px;background:#ffffff24;margin-top:43px;overflow:hidden}.splash-loading i{height:100%;width:45%;display:block;border-radius:20px;background:linear-gradient(90deg,#AF8CFA,#FF9FCB);animation:loadSweep 1.2s ease-in-out infinite}
.splash-privacy{position:absolute;bottom:38px;font-size:12px;color:#CFB2D9}
.love-message{display:flex;gap:11px;align-items:center;padding:14px 16px;margin:12px 0 16px;border-radius:20px;border:1px solid #D9A4E63B;background:linear-gradient(110deg,#4B2B604F,#6B335E3B);color:#F7DBEF;font-size:13px;line-height:1.5}
.love-message .love-symbol{font-size:27px;filter:drop-shadow(0 0 9px #FF9BCB)}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#73F4BD;box-shadow:0 0 0 5px #70F1B61B;display:inline-block;animation:blinkRomantic 2.5s infinite}
@keyframes pulseRomantic{50%{box-shadow:0 0 0 7px #D881DF22,0 11px 31px #D479DB60;transform:scale(1.025)}}
@keyframes heartBeat{0%,100%{transform:scale(1)}30%{transform:scale(1.1)}45%{transform:scale(1.02)}60%{transform:scale(1.08)}}
@keyframes halo{50%{transform:scale(1.08);opacity:.65}}@keyframes floatHeart{50%{transform:translateY(-12px);opacity:.45}}@keyframes blinkRomantic{50%{opacity:.5}}@keyframes loadSweep{0%{transform:translateX(-105%)}100%{transform:translateX(350%)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body>
<div id="splash" class="splash" aria-label="Together অ্যাপ চালু হচ্ছে">
  <div class="splash-art"><div class="splash-halo"></div><div class="splash-heart">♥</div><span class="tiny-heart th1">♥</span><span class="tiny-heart th2">♥</span><span class="tiny-heart th3">♥</span></div>
  <div class="splash-title">Together<span>♥</span></div>
  <div class="splash-subtitle">দুটি হৃদয় · একটি সুন্দর সংযোগ</div>
  <div class="splash-loading"><i></i></div>
  <div class="splash-privacy">🔒 সম্মতি ও গোপনীয়তার সঙ্গে</div>
</div>
<main class="page" id="app"></main><div id="bottom" class="nav hidden"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const preview=new URLSearchParams(location.search).get('preview')==='1';
window.setTimeout(()=>document.getElementById('splash')?.classList.add('done'),1450);
let route='login',mode='login',isBusy=false,profile=null,partner=null,history=[],page=0,serviceActive=false,server='',accountPhone='',mapCenter=null,mapZoom=14,historyBusy=false,selectedDay='';
const app=document.querySelector('#app'),bottom=document.querySelector('#bottom');
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const R={};let seq=1;
function native(method,...args){return new Promise((resolve,reject)=>{
  if(preview){return resolve({});}
  if(!window.TogetherNative){return reject(Error('শুধু Android অ্যাপ থেকে এই ফিচার ব্যবহার করা যাবে'));}
  const id=String(seq++);R[id]={resolve,reject};
  try{TogetherNative[method](id,...args);}catch(e){delete R[id];reject(e);}
});}
window.nativeReply=(id,ok,json)=>{
 const cb=R[id];if(!cb)return;delete R[id];
 let o;try{o=JSON.parse(json);}catch{o={error:'ভুল সার্ভার ডেটা'};}
 ok?cb.resolve(o):cb.reject(Error(o.error||'অনুরোধ ব্যর্থ'));
};
async function api(method,path,data){
 if(preview){
  if(path==='/health')return {ok:true};
  if(path==='/v1/partner')return {paired:true,name:'Demo Partner',sharing:true,location:{latitude:23.7806,longitude:90.4070,accuracy_m:15,received_at:new Date().toISOString()}};
  if(path==='/v1/me')return {user:{name:'Demo User',sharing:true},paired:true,partner:{name:'Demo Partner',sharing:true}};
  if(path.startsWith('/v1/history'))return {history:[],hasMore:false};
  return {ok:true};
 }
 return native('call',method,path,data?JSON.stringify(data):'');
}
function notify(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hidden'),3500)}
function timeAgo(t){if(!t)return 'আপডেট নেই';const sec=Math.max(0,Math.round((Date.now()-new Date(t).getTime())/1000));if(!Number.isFinite(sec))return 'সময় অজানা';if(sec<60)return sec+' সেকেন্ড আগে';if(sec<3600)return Math.floor(sec/60)+' মিনিট আগে';if(sec<86400)return Math.floor(sec/3600)+' ঘণ্টা আগে';return Math.floor(sec/86400)+' দিন আগে'}
function header(heading='Together'){return `<header class="header"><div><div class="brand">${escapeHtml(heading)} <span class="heart">♥</span></div><div class="minor">Always connected, with consent</div></div><div class="round-icon">♡</div></header>${preview?'<div class="preview-banner">শুধু ডিজাইন প্রিভিউ — লাইভ লোকেশন নয়</div>':''}`;}
function navigation(){bottom.classList.remove('hidden');bottom.innerHTML=[['home','⌂','হোম'],['history','◷','হিস্ট্রি'],['connect','♡','কানেক্ট'],['settings','⚙','সেটিংস']].map(([id,ico,title])=>`<button class="${route===id?'active':''}" data-nav="${id}"><span class="ico">${ico}</span>${title}</button>`).join('');}
function render(){
 if(route==='login')return renderAuth();
 navigation();
 if(route==='home')renderHome();
 else if(route==='connect')renderConnect();
 else if(route==='history')renderHistory();
 else if(route==='settings')renderSettings();
}
function renderAuth(){bottom.classList.add('hidden');
 app.innerHTML=`<section class="welcome"><div class="logo">♡</div><div class="eyebrow">COUPLE LOCATION SHARING</div><div class="headline">Together <span class="glow">♥</span><br>দূরে থেকেও পাশে</div><p class="hint">যেখানেই থাকুন, ভালোবাসার মানুষটি থাকুক আপনার কাছে—নিজের অনুমতিতে নিরাপদ GPS শেয়ারিং।</p><div class="love-message"><span class="love-symbol">❣</span><span>তুমি যেখানে, আমার ভালোবাসাও সেখানে।<br><small>শুধু দুজনের ব্যক্তিগত কানেকশন</small></span></div>
 <form id="authForm" class="auth-form"><div class="pill">${mode==='login'?'লগইন করুন':'নতুন অ্যাকাউন্ট'}</div>
 ${mode==='register'?'<label class="field">আপনার নাম<input required minlength="2" maxlength="80" name="name" placeholder="আপনার নাম" autocomplete="name"></label>':''}
 <label class="field">মোবাইল নম্বর<input name="phone" required inputmode="tel" type="tel" placeholder="017XXXXXXXX" autocomplete="tel"></label>
 <label class="field">পাসওয়ার্ড<input name="password" required type="password" minlength="8" placeholder="কমপক্ষে ৮ অক্ষর" autocomplete="${mode==='login'?'current-password':'new-password'}"></label>
 <button class="primary full" type="submit">${mode==='login'?'লগইন':'অ্যাকাউন্ট খুলুন'} →</button></form>
 <p class="hint" style="text-align:center"><button class="link" id="switchMode">${mode==='login'?'নতুন অ্যাকাউন্ট তৈরি করুন':'আগের অ্যাকাউন্টে লগইন করুন'}</button></p>
 <div class="card"><b>সার্ভার সংযোগ</b><div class="label" style="margin-top:7px">আপনার HTTPS সার্ভার ঠিকানা</div><label class="field"><input id="serverInput" value="${escapeHtml(server)}" placeholder="https://your-app.onrender.com" autocapitalize="none" spellcheck="false"></label><div class="btn-row"><button id="setServer" class="secondary small">সার্ভার ঠিকানা সংরক্ষণ</button><button id="testServer" class="outline small">✓ কানেকশন টেস্ট</button></div></div>

function drawMap(loc){const map=document.querySelector('#map');if(!map)return;
 const old=map.querySelectorAll('.tile,.pin');old.forEach(e=>e.remove());
 document.querySelector('#zoomPlus').onclick=()=>{mapZoom=Math.min(18,mapZoom+1);drawMap(loc)};
 document.querySelector('#zoomMinus').onclick=()=>{mapZoom=Math.max(3,mapZoom-1);drawMap(loc)};
 if(!loc)return;
 const notice=document.querySelector('#mapNotice');if(notice)notice.remove();
 const center=mapCenter||{lat:Number(loc.latitude),lon:Number(loc.longitude)};
 const z=mapZoom,n=Math.pow(2,z),lat=Math.max(-85.051128,Math.min(85.051128,center.lat));
 const x=(center.lon+180)/360*n*256,y=(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n*256;
 const w=map.clientWidth||300,h=map.clientHeight||272;
 for(let tx=Math.floor((x-w/2)/256);tx<=Math.floor((x+w/2)/256);tx++)for(let ty=Math.floor((y-h/2)/256);ty<=Math.floor((y+h/2)/256);ty++){
  if(ty<0||ty>=n)continue;
  const im=document.createElement('img');im.className='tile';im.alt='';im.draggable=false;
  im.src=`https://tile.openstreetmap.org/${z}/${((tx%n)+n)%n}/${ty}.png`;
  im.style.left=(tx*256-(x-w/2))+'px';im.style.top=(ty*256-(y-h/2))+'px';
  map.insertBefore(im,map.firstChild);
 }
 const llx=(Number(loc.longitude)+180)/360*n*256;
 const lly=(1-Math.asinh(Math.tan(Math.max(-85.051128,Math.min(85.051128,Number(loc.latitude)))*Math.PI/180))/Math.PI)/2*n*256;
 const pin=document.createElement('div');pin.className='pin';pin.style.left=(llx-(x-w/2))+'px';pin.style.top=(lly-(y-h/2))+'px';map.appendChild(pin);
 let start=null;
 map.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;start={px:e.clientX,py:e.clientY,x,y};map.setPointerCapture(e.pointerId)};
 map.onpointerup=e=>{if(!start)return;
  const px=start.x-(e.clientX-start.px),py=start.y-(e.clientY-start.py);
  mapCenter={lat:Math.atan(Math.sinh(Math.PI*(1-2*py/(n*256))))*180/Math.PI,lon:px/(n*256)*360-180};start=null;drawMap(loc);
 };
}
